  <!-- ===== 从 Worker KV 读取 WhatsApp 号码并替换按钮链接 ===== -->
  <script>
    (function () {
      "use strict";

      // 兜底号码：API 失败时用这个，保证按钮永远能用
      var FALLBACK_NUMBER = '8618603024764';

      function pickNumber(config) {
        if (!config || !Array.isArray(config.whatsapp) || !config.whatsapp.length) {
          return FALLBACK_NUMBER;
        }
        var list = config.whatsapp;

        // 轮询模式：前端随机挑一个（真正轮询应由 Worker 处理）
        if (config.routing_mode === 'round_robin') {
          return list[Math.floor(Math.random() * list.length)].number;
        }

        // 单号码模式：优先默认号码，否则第一个
        var target = list.find(function (x) { return x.is_default; }) || list[0];
        return target.number;
      }

      function applyNumber(number) {
        var clean = String(number || '').replace(/\D/g, '');
        if (!clean) clean = FALLBACK_NUMBER;

        var buttons = document.querySelectorAll('[data-whatsapp-btn]');
        for (var i = 0; i < buttons.length; i++) {
          buttons[i].href = 'https://wa.me/' + clean;
        }
      }

      async function boot() {
        var config = null;
        try {
          var res = await fetch('/api/public/config', {
            cache: 'no-store',
            credentials: 'same-origin'
          });
          if (res.ok) config = await res.json();
        } catch (e) {
          console.warn('[Sulan] /api/public/config 读取失败，使用兜底号码:', e.message);
        }
        applyNumber(pickNumber(config));
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot, { once: true });
      } else {
        boot();
      }
    })();
  </script>

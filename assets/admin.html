    <script>
        // 初始化本地大盘状态树
        let localState = { 
            siteTitle: "SULAN PEPTIDE", 
            siteNotice: "系统正常运行", 
            formEnabled: true, 
            routingMode: "Single", 
            whatsappNumbers: [], 
            metaPixels: [], 
            tiktokPixels: [] 
        };

        // 左侧导航栏 Tab 页签切换联动逻辑
        function switchTab(tabIndex) {
            document.querySelectorAll('.tab-content').forEach((content, idx) => {
                if(idx === tabIndex) content.classList.add('active');
                else content.classList.remove('active');
            });
            document.querySelectorAll('.sidebar .menu-item').forEach((item, idx) => {
                if(idx === tabIndex) {
                    item.classList.add('active');
                    document.getElementById('pageTitle').innerText = item.innerText;
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 首屏异步从网关拉取数据回填
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/get-public-data');
                if (response.ok) {
                    const cloudData = await response.json();
                    localState = Object.assign(localState, cloudData);
                    
                    document.getElementById('siteTitle').value = localState.siteTitle;
                    document.getElementById('siteNotice').value = localState.siteNotice;
                    document.getElementById('formEnabled').checked = localState.formEnabled;
                    
                    const radioBtn = document.querySelector(`input[name="routingMode"][value="${localState.routingMode}"]`);
                    if(radioBtn) radioBtn.checked = true;
                    
                    // 监听基础输入的失焦(blur)或改变(change)事件，实现输入完自动保存
                    document.getElementById('siteTitle').addEventListener('blur', autoSaveToCloud);
                    document.getElementById('siteNotice').addEventListener('blur', autoSaveToCloud);
                    document.getElementById('formEnabled').addEventListener('change', autoSaveToCloud);
                    document.querySelectorAll('input[name="routingMode"]').forEach(radio => {
                        radio.addEventListener('change', autoSaveToCloud);
                    });

                    renderAllTables();
                }
            } catch (err) { 
                console.error("从远程 KV 状态加载失败:", err); 
            }
        });

        // 统一数据渲染驱动器
        function renderAllTables() {
            document.getElementById('waTable').innerHTML = localState.whatsappNumbers.map((item, index) => `
                <tr>
                    <td>${esc(item.label)}</td>
                    <td><code>${esc(item.number)}</code></td>
                    <td><button class="btn btn-danger" onclick="deleteRow('whatsappNumbers', ${index})">删除</button></td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">暂无客服号码，请点击右上角添加</td></tr>';

            document.getElementById('metaTable').innerHTML = localState.metaPixels.map((item, index) => `
                <tr>
                    <td><code>${esc(item.id)}</code></td>
                    <td>${esc(item.name)}</td>
                    <td><button class="btn btn-danger" onclick="deleteRow('metaPixels', ${index})">删除</button></td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">暂无 Meta 像素，请点击右上角添加</td></tr>';

            document.getElementById('tiktokTable').innerHTML = localState.tiktokPixels.map((item, index) => `
                <tr>
                    <td><code>${esc(item.id)}</code></td>
                    <td>${esc(item.name)}</td>
                    <td><button class="btn btn-danger" onclick="deleteRow('tiktokPixels', ${index})">删除</button></td>
                </tr>
            `).join('') || '<tr><td colspan="3" style="text-align:center;color:#9ca3af;">暂无 TikTok 像素，请点击右上角添加</td></tr>';
        }

        // 模态弹框开关器
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(id === 'waModal') { document.getElementById('waLabel').value=''; document.getElementById('waNum').value=''; }
            if(id === 'metaModal') { document.getElementById('metaId').value=''; document.getElementById('metaName').value=''; }
            if(id === 'tiktokModal') { document.getElementById('tiktokId').value=''; document.getElementById('tiktokName').value=''; }
        }

        // 添加号码动作（添加完立刻触发自动保存）
        function addWa() {
            const label = document.getElementById('waLabel').value.trim();
            const number = document.getElementById('waNum').value.trim();
            if(!label || !number) return alert('请填写完整的号码配置');
            localState.whatsappNumbers.push({ label, number });
            closeModal('waModal'); 
            renderAllTables();
            autoSaveToCloud(); // 🚀 触发自动保存
        }

        // 添加像素动作（添加完立刻触发自动保存）
        function addPixel(type) {
            const id = document.getElementById(type + 'Id').value.trim();
            const name = document.getElementById(type + 'Name').value.trim();
            if(!id || !name) return alert('请填写完整的像素信息');
            localState[type + 'Pixels'].push({ id, name });
            closeModal(type + 'Modal'); 
            renderAllTables();
            autoSaveToCloud(); // 🚀 触发自动保存
        }
        // 【针对你的需求核心改动】：点击弹窗确认删除后，立刻更新内存并秒级同步到云端 KV
        async function deleteRow(arrayKey, index) { 
            if(confirm('确定要删除此项配置吗？')) {
                localState[arrayKey].splice(index, 1); 
                renderAllTables(); 
                await autoSaveToCloud(); // 🚀 用户点击“确定”后，无需再点保存，直接在此处触发自动写云端逻辑
            }
        }

        // 🚀 后台“全自动”静默持久化同步核心函数
        async function autoSaveToCloud() {
            // 实时搜集页面散值，防止添加/删除时输入框内的数据未同步
            localState.siteTitle = document.getElementById('siteTitle').value.trim();
            localState.siteNotice = document.getElementById('siteNotice').value.trim();
            localState.formEnabled = document.getElementById('formEnabled').checked;
            
            const checkedRadio = document.querySelector('input[name="routingMode"]:checked');
            localState.routingMode = checkedRadio ? checkedRadio.value : "Single";

            try {
                // 向网关发送安全的绝对根 API 路径请求
                const res = await fetch('/api/update-kv-data', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ config: localState }) 
                });
                
                if(!res.ok) {
                    if(res.status === 401) {
                        alert('会话登录已过期，刚刚的操作未成功保存，请重新登录！');
                        location.reload();
                    } else {
                        console.error('静默自动保存失败，云端返回状态码：' + res.status);
                    }
                } else {
                    // 控制台默默打印，不弹窗打扰管理员操作，保持操作丝滑流畅
                    console.log('✅ 数据已自动全量固化至 Cloudflare KV 数据库');
                }
            } catch(e) { 
                console.error('自动保存失败，底座数据传输链路发生异常:', e); 
            }
        }

        // 安全注销会话
        async function doLogout() { 
            await fetch('/admin/logout-api'); 
            location.reload(); 
        }

        // 字符转义安全防御组件，预防 XSS 漏洞
        function esc(str) { 
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ''; 
        }
    </script>
</body>
</html>

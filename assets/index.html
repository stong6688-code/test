  <!-- 【核心修改】：前台单页与云端 KV 数据库完美联动脚本 -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // 1. 从我们在网关中写好的公开接口安全拉取最新的云端 KV 配置大盘
        const response = await fetch('/api/get-public-data');
        if (!response.ok) return console.error('读取云端配置大盘失败，状态码:', response.status);

        const cloudConfig = await response.json();
        const numbersPool = cloudConfig.whatsappNumbers || []; // 获取你在后台保存的号码池列表
        const routingMode = cloudConfig.routingMode || "Single"; // 获取分流路由模式

        // 兜底默认号码（如果后台被你全删空了，自动使用这个进行防死锁兜底）
        let targetWhatsAppNumber = "8618603024764";

        // 2. 根据你在后台切换的“分流模式”逻辑，计算出本次用户进站要分配给哪个客服
        if (numbersPool.length > 0) {
          if (routingMode === "Single") {
            // 模式 A：固定使用你在后台添加的第一个号码
            targetWhatsAppNumber = numbersPool[0].number;
          } else if (routingMode === "Round Robin") {
            // 模式 B：多号码均等轮询分流机制
            // 基于浏览器本地随机数或时间戳进行毫秒级进站权重分流，确保广告进来的流量绝对均匀分配到各个客服
            const randomIndex = Math.floor(Math.random() * numbersPool.length);
            targetWhatsAppNumber = numbersPool[randomIndex].number;
          }
        }

        // 过滤清洗掉号码中可能误输入的空格、+号或横杠，确保 wa.me 标准接口能够安全跳转
        targetWhatsAppNumber = targetWhatsAppNumber.replace(/[\s\+\-\(\)]/g, '');

        // 3. 【核心替换】：定位前台所有包含你原本死号码链接的 A 标签，全量动态替换为最新的云端 KV 客服链接
        // 无论是大按钮、漂浮窗还是文本链接，只要包含该特定号码，都会被自动化清洗并更新
        const allLinks = document.querySelectorAll('a[href*="wa.me/8618603024764"]');
        allLinks.forEach(link => {
          link.setAttribute('href', `https://wa.me{targetWhatsAppNumber}`);
        });

        console.log(`[KV Linker] 流量分配成功！当前进站用户已路由至客服号码: ${targetWhatsAppNumber} (${routingMode} 模式)`);

      } catch (err) {
        console.error('[KV Linker] 前后台数据链路异常，已自动激活本地安全防死锁兜底机制:', err);
      }
    });
  </script>
  <!-- 【广告追踪】：动态注入你在后台配置的 Meta 与 TikTok 多像素追踪代码 -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // 重新获取或复用刚才的云端配置（这里为了文件绝对独立，再次安全读取一次接口）
        const res = await fetch('/api/get-public-data');
        if (!res.ok) return;
        const config = await res.json();

        // ==================== A. 动态注入 Meta (Facebook) Pixels ====================
        const metaPixels = config.metaPixels || [];
        if (metaPixels.length > 0) {
          // 1. 初始化标准基础 Meta 像素环境代码
          !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
              n.callMethod ?
                n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            }; if (!f._fbq) f._fbq = n;
            n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s)
          }(window,
            document, 'script', 'https://facebook.net');

          // 2. 遍历你在后台添加的所有 Meta 像素 ID，全量在前端进行初始化和基础 PageView 激活
          metaPixels.forEach(pixel => {
            if (pixel.id) {
              fbq('init', pixel.id.trim());
              fbq('track', 'PageView');
              console.log(`[广告追踪] Meta Pixel 成功注入并激活: ${pixel.name} (${pixel.id})`);
            }
          });
        }

        // ==================== B. 动态注入 TikTok Pixels ====================
        const tiktokPixels = config.tiktokPixels || [];
        if (tiktokPixels.length > 0) {
          // 1. 初始化标准基础 TikTok 像素环境代码
          !function (w, d, t) { w.TiktokAnalyticsObject = t; var ttq = w[t] = w[t] || []; ttq.methods = ["page", "track", "identify", "instances", "debug", "on", "off", "once", "ready", "alias", "group", "enableCookie", "disableCookie", "holdConsent", "revokeConsent", "grantConsent"], ttq.setAndDefer = function (t, e) { t[e] = function () { t.push([e].concat(Array.prototype.slice.call(arguments, 0))) } }; for (var i = 0; i < ttq.methods.length; i++)ttq.setAndDefer(ttq, ttq.methods[i]); ttq.instance = function (t) { for (var e = ttq[t] || [], n = 0; n < ttq.methods.length; n++)ttq.setAndDefer(e, ttq.methods[n]); return e }, ttq.load = function (e, n) { var o = "https://tiktok.com", r = d.getElementsByTagName("script")[0]; w.TiktokAnalyticsObjectApp = e, w.TiktokAnalyticsObjectAppId = n, w.TiktokAnalyticsObjectAppReady = w.TiktokAnalyticsObjectAppReady || []; var a = d.createElement("script"); a.type = "text/javascript", a.async = !0, a.src = o; var c = r.parentNode; c.insertBefore(a, r) }; }(window, document, 'ttq');

          // 2. 遍历你在后台添加的所有 TikTok 像素 ID，全量加载并触发首屏追踪
          tiktokPixels.forEach(pixel => {
            if (pixel.id) {
              ttq.load(pixel.id.trim());
              ttq.page();
              console.log(`[广告追踪] TikTok Pixel 成功注入并激活: ${pixel.name} (${pixel.id})`);
            }
          });
        }

      } catch (e) {
        console.error('[广告追踪] 动态像素追踪引擎加载异常:', e);
      }
    });
  </script>

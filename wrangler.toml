name = "watch-admin-system"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 静态资源目录配置（Workers 资产全栈模式）
[assets]
directory = "./public"
binding = "ASSETS"

# 【核心修复】仅让 Worker 优先拦截纯后端接口，防止其破坏 /admin 静态 HTML 页面的下发
run_worker_first = [
  "/api/get-public-data", 
  "/admin/login-api", 
  "/admin/logout-api", 
  "/admin/update-kv"
]

# KV 数据库绑定
[[kv_namespaces]]
binding = "DATA_KV"
id = "ea6c3cbc73b441968b0db08769f90a0f"

# 环境变量配置
[vars]
ADMIN_USER = "admin"
ADMIN_PASSWORD = "mySecurePassword123"      # 部署前请修改此密码
SESSION_SECRET = "SulanPeptide-Admin-2026-aVeryLongRandomSecret-9x7K2m"
